<!doctype html>
<html lang="es-CR" data-tema="auto">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` deja que el contenido llegue hasta el borde en los
       teléfonos con muesca; las barras fijas se apartan con env(safe-area-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sistema de Registro y Seguimiento de Acciones Climáticas · ODS 13</title>
  <meta name="description" content="Registrá lo que ya hacés —reciclar, moverte sin carro, ahorrar agua o luz— y mirá en kilos de CO₂ cuánto pesa de verdad. Prototipo funcional del sistema de acciones climáticas (ODS 13). Universidad Fidélitas, SC-302.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0c2921" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#060e0c" media="(prefers-color-scheme: dark)">
  <meta name="application-name" content="Acciones Climáticas">
  <meta name="apple-mobile-web-app-title" content="Acciones Climáticas">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- ==========================================================================
       TEMA, ANTES DE PINTAR

       Tiene que ser un script en línea y tiene que ir aquí arriba. Si la
       elección de tema se leyera desde `ui.js` (que va con `defer`, o sea
       después de construir el documento), el navegador ya habría pintado una
       pantalla clara y quien eligió oscuro vería un destello blanco en cada
       recarga. Son seis líneas a cambio de eso.
       ========================================================================== -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ods13.tema');
        document.documentElement.dataset.tema = (t === 'claro' || t === 'oscuro') ? t : 'auto';
      } catch (e) { /* navegación privada sin almacenamiento: queda en auto */ }
    })();
  </script>

  <!-- Tipografía: Bricolage Grotesque para titulares (voz con carácter),
       IBM Plex Sans para texto e interfaz, IBM Plex Mono para datos. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

  <!-- Sistema de diseño. El orden importa: tokens → base → layout → componentes → pantallas -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/screens.css">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230c2921' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M12 1.6 21 6.8v10.4L12 22.4 3 17.2V6.8z'/><path d='M8 15.4v-2.6M12 15.4v-5.2M16 15.4V8.6'/></svg>">
  <link rel="apple-touch-icon" href="assets/icono.svg">
</head>

<body>
  <a class="skip-link" href="#contenido">Ir al contenido principal</a>

  <!-- Región viva: anuncia el cambio de pantalla a los lectores de pantalla -->
  <p id="anuncio-ruta" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Toda la aplicación se dibuja aquí según la ruta (#/...) -->
  <div id="app"></div>

  <!-- Pantalla de arranque: se muestra mientras Firebase resuelve si hay
       sesión abierta. La quita `Aplicacion.arrancar()`. -->
  <div id="arranque" role="status" aria-live="polite">
    <div class="arranque-marca">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 1.6 21 6.8v10.4L12 22.4 3 17.2V6.8z"/>
        <path d="M8 15.4v-2.6M12 15.4v-5.2M16 15.4V8.6"/>
      </svg>
      <span>Registro y Seguimiento<br>de Acciones Climáticas</span>
    </div>
    <p class="arranque-estado">Estableciendo la sesión…</p>
  </div>

  <!-- Sin JavaScript no hay aplicación, pero tampoco puede quedar una pantalla
       de carga girando para siempre: se dice qué pasa y qué hacer. -->
  <noscript>
    <!-- Este <style> solo se aplica cuando el navegador tiene el guion
         desactivado, que es justo cuando la pantalla de carga no la va a
         quitar nadie. -->
    <style>#arranque { display: none; }</style>
    <div class="sin-js">
      <h1>Hace falta JavaScript</h1>
      <p>Este sistema calcula el CO₂ evitado en el navegador, así que necesita
         JavaScript activado. Actívalo y volvé a cargar la página.</p>
    </div>
  </noscript>

  <!-- Librería de gráficos, servida localmente para funcionar sin conexión -->
  <script defer src="assets/vendor/chart.umd.js"></script>

  <!-- ==========================================================================
       ORDEN DE CARGA

       Todos van con `defer`: se descargan en paralelo mientras el navegador
       termina de construir la página y se ejecutan después, pero SIEMPRE en
       este orden, que es lo que hace que las dependencias se cumplan. Sin
       `defer`, cada etiqueta detenía el análisis del documento y la primera
       pintura esperaba a los veinte archivos.

       Los `type="module"` del final ya eran diferidos por definición y se
       ejecutan a continuación, en el mismo orden del documento.
       ========================================================================== -->

  <!-- Núcleo -->
  <script defer src="assets/js/tema.js"></script>
  <script defer src="assets/js/icons.js"></script>
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/charts.js"></script>
  <script defer src="assets/js/fiesta.js"></script>

  <!-- Una pantalla por caso de uso (UC1 a UC10) más la de administración -->
  <script defer src="assets/js/screens/auth.js"></script>
  <script defer src="assets/js/screens/inicio.js"></script>
  <script defer src="assets/js/screens/accion.js"></script>
  <script defer src="assets/js/screens/progreso.js"></script>
  <script defer src="assets/js/screens/notificaciones.js"></script>
  <script defer src="assets/js/screens/insignias.js"></script>
  <script defer src="assets/js/screens/comunidad.js"></script>
  <script defer src="assets/js/screens/reporte.js"></script>
  <script defer src="assets/js/screens/perfil.js"></script>
  <script defer src="assets/js/screens/admin.js"></script>

  <!-- Enrutador, explicador, paleta de comandos, modo presentación y arranque -->
  <script defer src="assets/js/router.js"></script>
  <script defer src="assets/js/explicador.js"></script>
  <script defer src="assets/js/paleta.js"></script>
  <script defer src="assets/js/presentacion.js"></script>
  <script defer src="assets/js/app.js"></script>

  <!-- Escenas tridimensionales. Van antes que nube.js porque los módulos se
       ejecutan en el orden en que aparecen y la aplicación arranca desde
       nube.js: para entonces window.Escena3D, Bosque3D y Podio3D ya existen.
       Las tres importan `vista3d.js`, que a su vez importa three.js una sola
       vez: el navegador descarga y evalúa el módulo una vez y lo reutiliza. -->
  <script type="module" src="assets/js/escena3d.js"></script>
  <script type="module" src="assets/js/bosque3d.js"></script>
  <script type="module" src="assets/js/podio3d.js"></script>

  <!-- Capa de Firebase. Se ejecuta después de todos los scripts anteriores:
       para entonces DB, UI, Router y Aplicacion ya existen. Es también quien
       arranca la aplicación una vez que sabe si hay sesión. -->
  <script type="module" src="assets/js/nube.js"></script>
</body>
</html>
